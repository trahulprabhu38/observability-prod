apiVersion: 1

# Re-provision cleanly on every restart.
deleteDatasources:
  - name: Prometheus
  - name: Loki
  - name: Tempo

datasources:
  # -------------------------------------------------------------------------
  #  Metrics
  # -------------------------------------------------------------------------
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      manageAlerts: true
      # metric exemplars -> jump straight to the trace in Tempo
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
          urlDisplayLabel: "View trace"

  # -------------------------------------------------------------------------
  #  Logs
  # -------------------------------------------------------------------------
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # pull a trace_id out of a log line -> open it in Tempo
      derivedFields:
        - name: trace_id
          matcherType: regex
          matcherRegex: '(?i)trace[_-]?id"?[:=]"?([a-f0-9]+)'
          url: '${__value.raw}'
          datasourceUid: tempo
          urlDisplayLabel: "View trace"

  # -------------------------------------------------------------------------
  #  Traces
  # -------------------------------------------------------------------------
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        filterByTraceID: true
        filterBySpanID: false
        tags:
          - key: service.name
            value: service_name
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        tags:
          - key: service.name
            value: service
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      traceQuery:
        timeShiftEnabled: true
      spanBar:
        type: None
