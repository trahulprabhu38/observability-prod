# =============================================================================
#  Alertmanager - takes fired alerts from Prometheus and decides
#  WHO gets told, HOW, grouped how, and how often.
#
#  Pipeline:  Prometheus rule fires  ->  Alertmanager
#             route tree (match labels) -> receiver -> notification
#             + grouping (batch related alerts)
#             + inhibition (suppress noise when a bigger alert is already firing)
#             + silences (manual mute, set in the UI :9093)
#
#  All severities post to the SAME Discord channel (one webhook) - the route
#  tree below only changes *timing* per severity/env; each receiver gives the
#  message a different title/emoji so one channel stays scannable. The webhook
#  URL is a secret read from a file, never inlined here - see
#  alertmanager/secrets/discord_webhook_url.example.
#
#  Validate:  make validate
#  Test routing:  amtool config routes test --config.file=alertmanager.yml severity=critical
#  Docs: ../docs/04-grafana-alerting.md
# =============================================================================

global:
  resolve_timeout: 5m

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  receiver: default                 # fallback if nothing else matches
  group_by: ['alertname', 'box', 'service_name']
  group_wait: 30s                   # wait this long to collect siblings before first notify
  group_interval: 5m                # then, new alerts in an existing group wait this long
  repeat_interval: 4h               # re-send an un-resolved alert every 4h

  routes:
    # page for anything critical - fast first notify, nag every 30m
    - matchers: ['severity = "critical"']
      receiver: pager
      group_wait: 10s
      repeat_interval: 30m
      continue: true                # also fall through to the next matching route

    # dev/staging noise -> a muted channel, never pages
    - matchers: ['env =~ "dev|staging"']
      receiver: low-priority
      repeat_interval: 12h

    # everything else warning-level
    - matchers: ['severity = "warning"']
      receiver: default

# suppress the small stuff when the big stuff is already firing
inhibit_rules:
  # if a whole box is down, don't also alert on its individual containers
  - source_matchers: ['alertname = "TargetDown"', 'severity = "critical"']
    target_matchers: ['severity =~ "warning|info"']
    equal: ['box']
  # a firing critical for an alertname mutes the warning of the same alertname/scope
  - source_matchers: ['severity = "critical"']
    target_matchers: ['severity = "warning"']
    equal: ['alertname', 'box', 'service_name']

receivers:
  - name: default
    discord_configs:
      - webhook_url_file: /etc/alertmanager/secrets/discord_webhook_url
        username: 'Alertmanager'
        title: '{{ if eq .Status "firing" }}⚠️{{ else }}✅{{ end }} {{ .CommonLabels.alertname }} · warning'
        message: '{{ template "discord.message" . }}'
        send_resolved: true

  - name: pager
    discord_configs:
      - webhook_url_file: /etc/alertmanager/secrets/discord_webhook_url
        username: 'Alertmanager'
        title: '{{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }} {{ .CommonLabels.alertname }} · CRITICAL'
        message: '{{ template "discord.message" . }}'
        send_resolved: true

  - name: low-priority
    discord_configs:
      - webhook_url_file: /etc/alertmanager/secrets/discord_webhook_url
        username: 'Alertmanager'
        title: '{{ if eq .Status "firing" }}🔕{{ else }}✅{{ end }} {{ .CommonLabels.alertname }} · {{ .CommonLabels.env }}'
        message: '{{ template "discord.message" . }}'
        send_resolved: true

  # --- other integrations, if you ever split channels or swap providers ---
  # slack_configs / pagerduty_configs / opsgenie_configs / telegram_configs /
  # msteams_configs take the same shape - see docs/04-grafana-alerting.md.
