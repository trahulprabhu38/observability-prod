# yet-another-cloudwatch-exporter (YACE) - pulls ECS/Fargate/ALB/RDS metrics from
# AWS CloudWatch and re-exposes them as Prometheus metrics on :5000/metrics.
#
# Enable with:   make ecs-up      (starts the `ecs` compose profile)
# Then uncomment the `ecs-cloudwatch` job in prometheus/prometheus.yml.
#
# Docs & full metric list: docs/05-ecs-metrics.md
#
# YACE metric naming:  aws_<namespace>_<metric>_<stat>
#   AWS/ECS               -> aws_ecs_cpuutilization_average
#   ECS/ContainerInsights -> aws_ecs_containerinsights_running_task_count_average
#   AWS/ApplicationELB    -> aws_applicationelb_httpcode_target_5xx_count_sum
#   AWS/RDS               -> aws_rds_freeable_memory_average
# Rule of thumb: lowercase the CloudWatch metric name and put "_" before every
# word boundary (lower->UPPER). Statistic becomes the suffix (average / sum /
# maximum / minimum / p95 ...). CloudWatch dimensions become labels prefixed
# with `dimension_`, e.g. dimension_LoadBalancer, dimension_DBInstanceIdentifier.
#
# The metric lists below are sized to feed the imported Grafana dashboards:
#   grafana/provisioning/dashboards/json/non-prod/aws-alb.json
#   grafana/provisioning/dashboards/json/non-prod/aws-ecs-metrics.json
# Trim anything you don't need - GetMetricData is billed per metric per request.
#
# Scoped deliberately to ONE cluster: every job below carries
# `search_tags: Environment=global-prod`, which matches only
# valura-global-prod-cluster (+ its ALB) - not the empty valura-prod-temp-cluster
# sitting in the same account. This bounds both the GetMetricData bill and the
# blast radius of this integration to the cluster that's actually running.
# RDS was dropped entirely (out of scope for the ECS ask; add a job back here
# if you need it later - see git history for the AWS/RDS block).
#
# Periods are 300s (5 min) everywhere, not CloudWatch's 60s minimum - ECS/ALB
# metrics don't need sub-5-minute resolution for a dashboard, and this alone
# is a 5x cut in GetMetricData request volume vs the 60s defaults YACE ships
# with. CloudWatch data lands with its own 1-5 min delay regardless.

apiVersion: v1alpha1

sts-region: ap-south-1

discovery:
  exportedTagsOnMetrics:
    AWS/ECS:
      - Name
      - Environment
  jobs:
    # ================================================================= ECS ===
    # ---- Cluster + service level (AWS/ECS namespace) ----
    - type: AWS/ECS
      regions: [ap-south-1]
      period: 300
      length: 600
      search_tags:
        - { key: Environment, value: global-prod }
      metrics:
        - { name: CPUUtilization,    statistics: [Average, Maximum] }
        - { name: MemoryUtilization, statistics: [Average, Maximum] }

    # ---- Container Insights: task/container level ----
    # Requires Container Insights enabled on the cluster:
    #   aws ecs update-cluster-settings --cluster <c> \
    #       --settings name=containerInsights,value=enabled
    # (already enabled on valura-global-prod-cluster)
    - type: ECS/ContainerInsights
      regions: [ap-south-1]
      period: 300
      length: 600
      search_tags:
        - { key: Environment, value: global-prod }
      metrics:
        - { name: RunningTaskCount,          statistics: [Average] }
        - { name: PendingTaskCount,          statistics: [Average] }
        - { name: DesiredTaskCount,          statistics: [Average] }
        - { name: ServiceCount,              statistics: [Average] }
        - { name: DeploymentCount,           statistics: [Average] }
        - { name: TaskSetCount,              statistics: [Average] }
        - { name: CpuUtilized,               statistics: [Average] }
        - { name: CpuReserved,               statistics: [Average] }
        - { name: MemoryUtilized,            statistics: [Average] }
        - { name: MemoryReserved,            statistics: [Average] }
        - { name: NetworkRxBytes,            statistics: [Average] }
        - { name: NetworkTxBytes,            statistics: [Average] }
        - { name: StorageReadBytes,          statistics: [Average] }
        - { name: StorageWriteBytes,         statistics: [Average] }
        - { name: EphemeralStorageUtilized,  statistics: [Average] }
        - { name: EphemeralStorageReserved,  statistics: [Average] }

    # NOTE: the "Capacity Provider Reservation" panel in aws-ecs-metrics.json
    # queries aws_ecs_managedscaling_capacity_provider_reservation_average.
    # AWS/ECS/ManagedScaling is not a YACE discovery type, so that one panel
    # stays empty unless you add it via a customNamespace job. Everything else
    # on the dashboard is covered below.

    # ============================================================ ALB / ELB ===
    - type: AWS/ApplicationELB
      regions: [ap-south-1]
      period: 300
      length: 600
      search_tags:
        - { key: Environment, value: global-prod }
      metrics:
        - { name: RequestCount,                    statistics: [Sum] }
        - { name: ActiveConnectionCount,           statistics: [Sum] }
        - { name: NewConnectionCount,              statistics: [Sum] }
        - { name: RejectedConnectionCount,         statistics: [Sum] }
        - { name: ProcessedBytes,                  statistics: [Sum] }
        - { name: ConsumedLCUs,                    statistics: [Sum] }
        - { name: TargetResponseTime,              statistics: [Average, p50, p95, p99] }
        - { name: TargetConnectionTime,            statistics: [Average] }
        - { name: TargetProcessingTime,            statistics: [Average] }
        - { name: HTTPCode_Target_2XX_Count,       statistics: [Sum] }
        - { name: HTTPCode_Target_3XX_Count,       statistics: [Sum] }
        - { name: HTTPCode_Target_4XX_Count,       statistics: [Sum] }
        - { name: HTTPCode_Target_5XX_Count,       statistics: [Sum] }
        - { name: HTTPCode_ELB_3XX_Count,          statistics: [Sum] }
        - { name: HTTPCode_ELB_4XX_Count,          statistics: [Sum] }
        - { name: HTTPCode_ELB_5XX_Count,          statistics: [Sum] }
        - { name: HealthyHostCount,                statistics: [Average] }
        - { name: UnHealthyHostCount,              statistics: [Average] }
        - { name: TargetConnectionErrorCount,      statistics: [Sum] }
        - { name: TargetTLSNegotiationErrorCount,  statistics: [Sum] }
        - { name: ClientTLSNegotiationErrorCount,  statistics: [Sum] }
