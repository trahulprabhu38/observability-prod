# Host / LXC alerts - fed by node-exporter.
# `for:` = how long the condition must hold before it fires (debounce).
# Every alert carries `severity` - Alertmanager routes on it (see alertmanager.yml).
groups:
  - name: infra
    rules:

      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} is down"
          description: "Prometheus has failed to scrape {{ $labels.instance }} for 2m."

      - alert: HostHighCPU
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "High CPU on {{ $labels.instance }} ({{ $labels.box }})"
          description: "CPU > 85% for 10m (currently {{ printf \"%.0f\" $value }}%)."

      - alert: HostHighMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "High memory on {{ $labels.instance }} ({{ $labels.box }})"
          description: "Memory used > 90% for 10m (currently {{ printf \"%.0f\" $value }}%)."

      - alert: HostDiskWillFillIn24h
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[6h], 24*3600) < 0
          and on (instance, device)
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes < 0.30
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} will fill within 24h"

      - alert: HostDiskAlmostFull
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes < 0.10
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} below 10% free"

      - alert: HostUnusualLoad
        expr: node_load15 / count without (cpu, mode) (node_cpu_seconds_total{mode="idle"}) > 2
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Load15 is 2x core count on {{ $labels.instance }}"

      - alert: HostClockSkew
        expr: abs(node_timex_offset_seconds) > 0.1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Clock on {{ $labels.instance }} is off by >100ms - fix NTP"

      - alert: HostOOMKills
        expr: increase(node_vmstat_oom_kill[10m]) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "Kernel OOM-killed a process on {{ $labels.instance }}"
