apiVersion: 1

# Re-provision cleanly on every Grafana restart.
deleteDatasources:
  - { name: Prometheus, orgId: 1 }
  - { name: Loki,       orgId: 1 }
  - { name: Jaeger,     orgId: 1 }
  - { name: Infinity,   orgId: 1 }
  - { name: CloudWatch, orgId: 1 }

datasources:
  # ---------------------------------------------------------------- METRICS ---
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      # click an exemplar dot on a latency panel -> jump to that exact trace
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jaeger
          urlDisplayLabel: "View trace in Jaeger"

  # ------------------------------------------------------------------- LOGS ---
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # pull a trace id out of a log line -> open it in Jaeger
      derivedFields:
        - name: trace_id
          matcherType: regex
          matcherRegex: '(?i)trace[_-]?id"?[:=]"?([a-f0-9]+)'
          url: '$${__value.raw}'
          datasourceUid: jaeger
          urlDisplayLabel: "View trace in Jaeger"

  # ----------------------------------------------------------------- TRACES ---
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    jsonData:
      # span -> logs for the same trace, in Loki, time-boxed around the span
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        filterByTraceID: true
        filterBySpanID: false
        tags:
          - key: service.name
            value: container        # maps span service.name -> Loki label `container`
      # span -> RED metrics in Prometheus
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        tags:
          - key: service.name
            value: service_name
        queries:
          - name: 'Request rate'
            query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags}[5m]))'
          - name: 'p95 latency (ms)'
            query: 'histogram_quantile(0.95, sum(rate(traces_spanmetrics_duration_milliseconds_bucket{$$__tags}[5m])) by (le))'
      # service map / node graph built from span-metrics
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      spanBar:
        type: None

  # --------------------------------------------------------- HTTP / JSON APIs ---
  # Infinity queries arbitrary REST/GraphQL endpoints. Used by the imported
  # "valura.ai - Cloudflare Analytics" dashboard, which calls the Cloudflare
  # GraphQL Analytics API. Set CF_API_TOKEN (+ CF_ZONE_ID / CF_ACCOUNT_ID used
  # inside the dashboard queries) in .env. Plugin is installed via
  # GF_INSTALL_PLUGINS in docker-compose.yml.
  - name: Infinity
    uid: infinity
    type: yesoreyeram-infinity-datasource
    access: proxy
    url: https://api.cloudflare.com/client/v4
    jsonData:
      auth_method: bearerToken
      customHealthCheckEnabled: true
      httpHeaderName1: Content-Type
      unsecuredQueryHandling: allow
      allowedHosts:
        - https://api.cloudflare.com
    secureJsonData:
      bearerToken: ${CF_API_TOKEN}

  # ----------------------------------------------------- AWS CloudWatch (logs) ---
  # OPT-IN. v2's design pulls AWS *metrics* through YACE into Prometheus (see the
  # aws-alb / aws-ecs-metrics / aws-rds dashboards), so you normally do NOT need
  # this. It exists only for the "AWS ECS - individual container logs" dashboard,
  # which uses CloudWatch Logs Insights - a query language Prometheus has no
  # equivalent for. Enable by uncommenting; needs the same AWS creds as YACE.
  #
  # - name: CloudWatch
  #   uid: cloudwatch
  #   type: cloudwatch
  #   access: proxy
  #   jsonData:
  #     authType: keys
  #     defaultRegion: ${AWS_REGION}
  #   secureJsonData:
  #     accessKey: ${AWS_ACCESS_KEY_ID}
  #     secretKey: ${AWS_SECRET_ACCESS_KEY}
