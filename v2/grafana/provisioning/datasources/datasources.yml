apiVersion: 1

# Re-provision cleanly on every Grafana restart.
deleteDatasources:
  - { name: Prometheus, orgId: 1 }
  - { name: Loki,       orgId: 1 }
  - { name: Jaeger,     orgId: 1 }

datasources:
  # ---------------------------------------------------------------- METRICS ---
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      # click an exemplar dot on a latency panel -> jump to that exact trace
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jaeger
          urlDisplayLabel: "View trace in Jaeger"

  # ------------------------------------------------------------------- LOGS ---
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # pull a trace id out of a log line -> open it in Jaeger
      derivedFields:
        - name: trace_id
          matcherType: regex
          matcherRegex: '(?i)trace[_-]?id"?[:=]"?([a-f0-9]+)'
          url: '$${__value.raw}'
          datasourceUid: jaeger
          urlDisplayLabel: "View trace in Jaeger"

  # ----------------------------------------------------------------- TRACES ---
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    jsonData:
      # span -> logs for the same trace, in Loki, time-boxed around the span
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        filterByTraceID: true
        filterBySpanID: false
        tags:
          - key: service.name
            value: container        # maps span service.name -> Loki label `container`
      # span -> RED metrics in Prometheus
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        tags:
          - key: service.name
            value: service_name
        queries:
          - name: 'Request rate'
            query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags}[5m]))'
          - name: 'p95 latency (ms)'
            query: 'histogram_quantile(0.95, sum(rate(traces_spanmetrics_duration_milliseconds_bucket{$$__tags}[5m])) by (le))'
      # service map / node graph built from span-metrics
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      spanBar:
        type: None
