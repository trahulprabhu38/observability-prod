services:
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      # REPLACE_ME before deploying. A read-only role is enough:
      #   CREATE ROLE prometheus WITH LOGIN PASSWORD '...';
      #   GRANT pg_monitor TO prometheus;   -- PG10+
      - DATA_SOURCE_NAME=postgresql://prometheus:REPLACE_ME@localhost:5432/postgres?sslmode=disable
    network_mode: host   # ports: is a no-op under host networking; exporter listens on :9187 directly
